  MODEL: "/home/xxf/NewVLLM/models_olmoe/uni_05_pa_001arc_8-32/checkpoint-3039"
  QOS_K_LIST: "r1,32"
  PERF_MODEL_PATH: "/home/xxf/NewVLLM/test/olmoe_perf_model_32.json"

olmoe_8_a100: &olmoe_8_a100
