  MODEL: "/home/xxf/NewVLLM/models/olmoe-7B-A1B"
  QOS_K_LIST: "r1,8"
  PERF_MODEL_PATH: "/home/xxf/NewVLLM/test/olmoe_perf_model_8.json"




online_ours: &online_ours
  DP_SIZE: 2
  VLLM_DP_K_AWARE_DISPATCH: 1
  QOS_AWARE: 1

online_vllm_k_aware: &online_vllmK
  DP_SIZE: 2
  VLLM_DP_K_AWARE_DISPATCH: 0
  QOS_AWARE: 1

online_vllm_default: &online_vllmD
  DP_SIZE: 2
  VLLM_DP_K_AWARE_DISPATCH: 0
  QOS_AWARE: 0

online_vllm_default_tp: &online_vllmT
  DP_SIZE: 1
  TP_SIZE: 2
  SHARE_ATTN_ACROSS_TOPK: false
  GPU_MEM_UTIL: 0.6
  VLLM_DP_K_AWARE_DISPATCH: 0
  QOS_AWARE: 0

offline_ours: &offline_ours
  DP_SIZE: 1
  VLLM_DP_K_AWARE_DISPATCH: 0
  QOS_AWARE: 1
  SCHED_MODE: "ttft_agnostic"

offline_vllm_k_aware: &offline_vllmK
  DP_SIZE: 1
  VLLM_DP_K_AWARE_DISPATCH: 0
  QOS_AWARE: 1

offline_vllm_default: &offline_vllmD
  DP_SIZE: 1
  VLLM_DP_K_AWARE_DISPATCH: 0
  QOS_AWARE: 0

defaults_env: &defaults_env
  NUM_PROMPTS: 2048

