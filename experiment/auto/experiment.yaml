  VLLM_DP_K_HYSTERESIS: 32
  VLLM_DP_K_COOLDOWN: 16

dpsk_24_a100: &dpsk_24_a100
  <<: *dpsk
  MODEL: "/home/xxf/NewVLLM/models_dpsk/uni_05_pa_001arc_8-24/checkpoint-2500"
  QOS_K_LIST: "r1,24"
  PERF_MODEL_PATH: "home/xxf/NewVLLM/test/dpsk_perf_model_24.json"

dpsk_6_a100: &dpsk_6_a100
