# 全部实验配置
experiments:
  # 最基础的 fifo
  - name: fifo_default
    server_args: [fifo]
    bench_args: [fifo, "2048"]
    env:
      REQUEST_RATES: "5"
      QOS_K_STD: "5"
      DISPATCH_LOG: /home/xxf/NewVLLM/vllm/test/dispatch_logs/fifo_default.csv

  # fifo_safe_swap，调 window
  - name: fifo_safe_swap_w8
    server_args: [fifo_safe_swap]
    bench_args: [fifo_safe_swap, "2048"]
    env:
      REQUEST_RATES: "5"
      FIFO_SAFE_SWAP_WINDOW: "8"
      QOS_K_STD: "5"
      DISPATCH_LOG: /home/xxf/NewVLLM/vllm/test/dispatch_logs/fifo_safe_swap_w8.csv

  # 吞吐模式
  - name: ttft_agnostic_ratio05
    server_args: [ttft_agnostic]
    bench_args: [ttft_agnostic, "2048"]
    env:
      REQUEST_RATES: "inf"
      TTFT_AGNOSTIC_MIN_BATCH_RATIO: "0.5"
      QOS_K_STD: "5"
      DISPATCH_LOG: /home/xxf/NewVLLM/vllm/test/dispatch_logs/ttft_agnostic_ratio05.csv